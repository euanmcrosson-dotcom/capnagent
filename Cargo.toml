[workspace]
members = [
    "crates/capnagent-core",
    "crates/capnagent-wasm",
    "crates/capnagent-py",
    "crates/capnagent-cli",
]
resolver = "2"

[workspace.package]
version = "0.9.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/euanmcrosson-dotcom/capnagent"
authors = ["Euan McRosson <euanmcrosson@gmail.com>"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
