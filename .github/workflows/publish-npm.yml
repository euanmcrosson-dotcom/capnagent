name: publish-npm

# Publishes @capnagent/core and @capnagent/mcp to npm. Runs only on tags
# matching `npm-v*` (an independent version stream from the `v*` Rust/CLI tags
# and the `py-v*` Python tags), or on a manual dispatch — and a dispatch
# defaults to a DRY RUN, so nothing reaches npm unless explicitly asked.
#
# To publish:
#   1. Bump the package versions (packages/capnagent*/package.json) + push.
#   2. git tag npm-v0.9.0 && git push origin npm-v0.9.0
#
# core is published before mcp because @capnagent/mcp depends on
# @capnagent/core (^0.9.0); a consumer installing mcp needs core already live.
#
# Requirements (one-time, maintainer):
#   - Repo secret NPM_TOKEN: an npm automation/granular token with publish
#     rights to the @capnagent scope.
#   - Provenance is attached via OIDC (`id-token: write` below + the
#     `--provenance` flag, ON by default; the repo must be public for npm to
#     accept the attestation). If a first publish is rejected on the provenance
#     step, re-run from Actions → publish-npm → Run workflow with
#     provenance=false and publish=true. The token alone is enough to publish.

on:
  push:
    tags: ["npm-v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Actually publish to npm (otherwise dry-run)"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"
      provenance:
        description: "Attach build provenance (turn OFF if npm rejects it on a first publish)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read
  id-token: write # npm provenance attestation

jobs:
  publish:
    name: build + publish (@capnagent/core, @capnagent/mcp)
    runs-on: ubuntu-latest
    # Belt-and-braces: only a real `npm-v*` tag, or an explicit dispatch, gets
    # this far. A stray `v*` / `py-v*` release event can never publish to npm.
    if: startsWith(github.ref, 'refs/tags/npm-v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: publish-npm
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: install wasm-pack
        run: cargo install --locked wasm-pack

      - name: npm ci
        run: npm ci

      # The SDK loads this vendored nodejs-target build; the per-package
      # prepack (tsc + strip wasm/.gitignore) then completes the tarball.
      - name: build vendored nodejs wasm
        run: npm run build:wasm:node

      - name: build dist (core + mcp)
        run: |
          npm run -w @capnagent/core build
          npm run -w @capnagent/mcp build

      # Compute the publish flags once, used by both steps below.
      #  - provenance: ON by default (incl. every tag push); a manual dispatch
      #    can set provenance=false to skip it if npm rejects the attestation
      #    on a first publish. Controlled purely by the --provenance flag here —
      #    package.json no longer forces it via publishConfig.
      #  - dry-run: a manual dispatch is a dry run unless publish=true. Tag
      #    pushes always publish for real.
      - name: compute publish flags
        id: flags
        run: |
          PROV="--provenance"
          DRY=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            [ "${{ inputs.provenance }}" = "true" ] || PROV=""
            [ "${{ inputs.publish }}" = "true" ] || DRY="--dry-run"
          fi
          echo "prov=$PROV" >> "$GITHUB_OUTPUT"
          echo "dry=$DRY" >> "$GITHUB_OUTPUT"
          echo "::notice::publish flags — provenance='${PROV:-OFF}' mode='${DRY:-REAL PUBLISH}'"

      # core first — @capnagent/mcp depends on it.
      - name: publish @capnagent/core
        run: npm publish -w @capnagent/core --access public ${{ steps.flags.outputs.prov }} ${{ steps.flags.outputs.dry }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: publish @capnagent/mcp
        run: npm publish -w @capnagent/mcp --access public ${{ steps.flags.outputs.prov }} ${{ steps.flags.outputs.dry }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
