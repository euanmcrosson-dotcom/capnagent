name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Avoid spending CI minutes on superseded pushes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy (core)
        run: cargo clippy -p capnagent-core --tests --benches -- -D warnings

      - name: cargo clippy (wasm)
        run: cargo clippy -p capnagent-wasm -- -D warnings

      # Native check on the wasm crate as a smoke test. The actual
      # wasm32-unknown-unknown build + wasm-pack pipeline is tracked
      # under packages/capnagent and runs in a separate job once the
      # TS adapter lands.
      - name: cargo check (wasm crate, native target)
        run: cargo check -p capnagent-wasm

      # Each integration target individually so a single failure produces
      # a focused log instead of a 100-test wall.
      - name: property tests
        run: cargo test -p capnagent-core --test property_tests
      - name: context tests
        run: cargo test -p capnagent-core --test context_tests
      - name: caveat DSL tests
        run: cargo test -p capnagent-core --test caveat_dsl_tests
      - name: audit tests
        run: cargo test -p capnagent-core --test audit_tests
      - name: integration tests
        run: cargo test -p capnagent-core --test integration_tests
      - name: revocation tests
        run: cargo test -p capnagent-core --test revocation_tests
      - name: holder-of-key tests
        run: cargo test -p capnagent-core --test holder_of_key_tests
      - name: replay-protection tests
        run: cargo test -p capnagent-core --test replay_protection_tests

  audit:
    name: cargo audit (RustSec advisory DB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  deny:
    name: cargo deny (licenses, bans, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: EmbarkStudios/cargo-deny-action@6c8f9facfa5047ec02d8485b6bf52b587b7777d1 # v2
        with:
          command: check all

  # WASM build pipeline — produces the JS-loadable artefact that
  # @capnagent (TS wrapper) and @capnagent/mcp (MCP adapter) depend on.
  # Smoke-tested by importing the build output and asserting the locked
  # WEEK3_SPEC §3.1 export surface.
  wasm-build:
    name: wasm-pack build + node smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          # Separate cache slot from the `test` job so wasm-target
          # builds don't evict the native-target ones (and vice versa).
          shared-key: wasm-build

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: install wasm-pack
        run: cargo install --locked wasm-pack

      - name: wasm-bindgen round-trip tests (capnagent-wasm, node)
        run: wasm-pack test --node crates/capnagent-wasm

      - name: npm ci (workspace root)
        run: npm ci

      # Bundler-target build + .d.ts contract smoke. The published packages no
      # longer consume this output (they use the nodejs target vendored below),
      # but it keeps the bundler artifact + the locked export surface validated
      # for any future bundler consumer.
      - name: npm run build:wasm
        run: npm run build:wasm

      - name: node smoke test
        run: npm run smoke:wasm

      # nodejs-target build vendored into @capnagent/core (what the SDK and its
      # tests actually load — runs in plain Node, no bundler). Required before
      # building/testing the TS packages.
      - name: npm run build:wasm:node
        run: npm run build:wasm:node

      - name: build @capnagent/core dist (required by demo)
        run: npm run -w @capnagent/core build

      - name: workspace tests (TS packages + demo)
        run: npm test --workspaces --if-present

      # Coverage gate on the security-critical SDK wrapper (verify path +
      # error mapping). Thresholds live in packages/capnagent/vitest.config.ts;
      # an unguarded regression in index.ts fails here.
      - name: SDK coverage gate (@capnagent/core)
        run: npm run -w @capnagent/core test:coverage

      # Guard the publishable tarballs: build the dist, pack, and assert each
      # is self-contained. Catches the wasm-pack `.gitignore: *` trap (which
      # silently drops the vendored WASM) and any missing-dist regression
      # before a release tag ever reaches npm.
      - name: verify npm tarballs are self-contained
        run: |
          npm run -w @capnagent/core build
          npm run -w @capnagent/mcp build
          npm pack -w @capnagent/core --pack-destination /tmp >/dev/null
          npm pack -w @capnagent/mcp --pack-destination /tmp >/dev/null
          echo "--- @capnagent/core tarball ---"
          tar -tzf /tmp/capnagent-core-*.tgz | grep -q 'wasm/capnagent_wasm_bg.wasm' \
            || { echo "FAIL: @capnagent/core tarball is missing the vendored WASM"; exit 1; }
          tar -tzf /tmp/capnagent-core-*.tgz | grep -q 'dist/index.js' \
            || { echo "FAIL: @capnagent/core tarball is missing dist/index.js"; exit 1; }
          echo "--- @capnagent/mcp tarball ---"
          tar -tzf /tmp/capnagent-mcp-*.tgz | grep -q 'dist/index.js' \
            || { echo "FAIL: @capnagent/mcp tarball is missing dist/index.js"; exit 1; }
          echo "OK: both tarballs are self-contained"

  # Python bindings — builds a wheel and runs the pytest suite (smoke tests +
  # the ported purple-team rounds 01/03/07), so the PyPI package's adversarial
  # proof is enforced on every push, not just shipped alongside it.
  python-tests:
    name: capnagent-py pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: python-tests
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: install maturin + pytest + cryptography + mcp-guardrails
        # cryptography: ed25519 signer for purple-team round 02 (hok replay).
        # mcp-guardrails: the Guard layer in the three-layer Find→Bind→Guard demo test.
        run: pip install maturin pytest cryptography mcp-guardrails

      - name: build + install the wheel
        run: |
          maturin build --release --manifest-path crates/capnagent-py/Cargo.toml --out dist
          pip install --no-index --find-links dist capnagent

      - name: pytest (smoke + purple-team rounds)
        run: pytest crates/capnagent-py/tests -q

  # Coverage gate on the security engine. capnagent-core is the only crate
  # whose line coverage we enforce: the CLI is a thin binary, the wasm/py
  # bindings are exercised through their own consumers (wasm-pack test, pytest),
  # but the engine — issuer, verifier, caveat DSL, audit, revocation, replay —
  # is where an untested branch is a fail-open. Measured on Linux because the
  # windows-gnu toolchain ships no profiler runtime (can't instrument locally).
  coverage:
    name: coverage gate (capnagent-core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          shared-key: coverage
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      # --summary-only prints the per-file table so the real numbers are visible
      # in the log; --fail-under-lines is the enforced floor.
      #
      # Baseline at gate creation: 87.8% lines total. The security *decision*
      # logic is well above that — context 100%, verifier 95%, capability 94%,
      # audit 93%, revocation/issuer/hex 91-92%, nonce_store ~89% — and every
      # adversarial arm (forged chain, bad/wrong-length/replayed proof,
      # revocation, type/unit mismatch, the A.1 integer-domain rule) is covered
      # by the 100+ engine tests. The residual gap is concentrated in
      # caveat_dsl's hand-rolled RFC-3339 parser: many distinct fail-CLOSED
      # parse-error message arms, already proven non-panicking by the parser
      # fuzz. Covering each byte-position error string line-by-line is low value.
      #
      # Floor is 86, not the 87.8 baseline: the parser fuzz feeds *random* input
      # (proptest), so its contribution to caveat_dsl coverage swings ~±0.5% of
      # the total run-to-run. 86 absorbs that jitter so the gate can't red-fail
      # master on an unlucky seed, while still tripping on a real regression (a
      # dropped test module moves coverage by whole points). Raise it as the
      # deterministic baseline genuinely improves — never lower.
      - name: cargo llvm-cov (capnagent-core, gated)
        run: cargo llvm-cov -p capnagent-core --summary-only --fail-under-lines 86
