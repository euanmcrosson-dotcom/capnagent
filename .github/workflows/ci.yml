name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Avoid spending CI minutes on superseded pushes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy (core)
        run: cargo clippy -p capnagent-core --tests -- -D warnings

      - name: cargo clippy (wasm)
        run: cargo clippy -p capnagent-wasm -- -D warnings

      # Native check on the wasm crate as a smoke test. The actual
      # wasm32-unknown-unknown build + wasm-pack pipeline is tracked
      # under packages/capnagent and runs in a separate job once the
      # TS adapter lands.
      - name: cargo check (wasm crate, native target)
        run: cargo check -p capnagent-wasm

      # Each integration target individually so a single failure produces
      # a focused log instead of a 100-test wall.
      - name: property tests
        run: cargo test -p capnagent-core --test property_tests
      - name: context tests
        run: cargo test -p capnagent-core --test context_tests
      - name: caveat DSL tests
        run: cargo test -p capnagent-core --test caveat_dsl_tests
      - name: audit tests
        run: cargo test -p capnagent-core --test audit_tests
      - name: integration tests
        run: cargo test -p capnagent-core --test integration_tests
      - name: revocation tests
        run: cargo test -p capnagent-core --test revocation_tests
      - name: holder-of-key tests
        run: cargo test -p capnagent-core --test holder_of_key_tests
      - name: replay-protection tests
        run: cargo test -p capnagent-core --test replay_protection_tests

  audit:
    name: cargo audit (RustSec advisory DB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  deny:
    name: cargo deny (licenses, bans, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check all

  # WASM build pipeline — produces the JS-loadable artefact that
  # @capnagent (TS wrapper) and @capnagent/mcp (MCP adapter) depend on.
  # Smoke-tested by importing the build output and asserting the locked
  # WEEK3_SPEC §3.1 export surface.
  wasm-build:
    name: wasm-pack build + node smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          # Separate cache slot from the `test` job so wasm-target
          # builds don't evict the native-target ones (and vice versa).
          shared-key: wasm-build

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: install wasm-pack
        run: cargo install --locked wasm-pack

      - name: npm ci (workspace root)
        run: npm ci

      - name: npm run build:wasm
        run: npm run build:wasm

      - name: node smoke test
        run: npm run smoke:wasm

      - name: build @capnagent/core dist (required by demo)
        run: npm run -w @capnagent/core build

      - name: workspace tests (TS packages + demo)
        run: npm test --workspaces --if-present
