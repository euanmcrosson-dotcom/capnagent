name: publish-pypi

# Builds platform wheels for capnagent-py and uploads to PyPI when a
# Python-binding release is published. The workflow only runs on tags
# matching `py-v*` (not on `v*` tags which mark Rust-core / WASM releases)
# so the Python binding has its own independent version stream.
#
# To publish:
#   1. Bump `crates/capnagent-py/pyproject.toml` version + push.
#   2. `git tag py-v0.7.1 && git push --tags`.
#   3. Create a GitHub Release pointing at the tag (this fires the
#      `release: published` trigger below).
#
# Auth model: PyPI Trusted Publishing (OIDC). No long-lived API token is
# stored as a repo secret — the publish job mints a short-lived token from
# GitHub's OIDC provider on each run, and PyPI verifies it against the
# trusted-publisher config for project `capnagent`:
#   Owner:        euanmcrosson-dotcom
#   Repository:   capnagent
#   Workflow:     publish-pypi.yml
#   Environment:  pypi
# If the trust relationship breaks, the publish step will fail with
# `invalid-publisher` and the wheels are still available as workflow
# artifacts for manual upload.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: "Upload to PyPI (via OIDC trusted publisher)"
        required: false
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

env:
  CARGO_TERM_COLOR: always

jobs:
  # ─── platform wheel jobs ─────────────────────────────────────────

  linux:
    name: wheel (linux-x86_64)
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/py-v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v6
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: x86_64-unknown-linux-gnu
          args: --release --out dist
          working-directory: crates/capnagent-py
          manylinux: auto
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-x86_64
          path: crates/capnagent-py/dist/*.whl

  windows:
    name: wheel (windows-x86_64)
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/py-v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v6
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: x86_64-pc-windows-msvc
          args: --release --out dist
          working-directory: crates/capnagent-py
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-x86_64
          path: crates/capnagent-py/dist/*.whl

  macos-arm:
    name: wheel (macos-arm64)
    runs-on: macos-14  # apple-silicon runner
    if: startsWith(github.ref, 'refs/tags/py-v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v6
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: aarch64-apple-darwin
          args: --release --out dist
          working-directory: crates/capnagent-py
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-arm64
          path: crates/capnagent-py/dist/*.whl

  # macOS x86_64 wheels are deliberately not built. The `macos-13` runner
  # pool is being deprecated and on the py-v0.7.1 release queued for
  # 20+ minutes without starting. New Mac hardware is exclusively
  # Apple Silicon (arm64); maintenance cost vs yield for x86_64 macOS
  # wheels is poor. macOS x86_64 users can `pip install --no-binary`
  # to build from the sdist, which always works because the Rust core
  # is portable. Reconsider if there's user-driven demand.

  # ─── sdist (one source build, no platform dep) ───────────────────

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/py-v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v6
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          command: sdist
          args: --out dist
          working-directory: crates/capnagent-py
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: crates/capnagent-py/dist/*.tar.gz

  # ─── upload to PyPI ──────────────────────────────────────────────

  publish:
    name: publish to PyPI
    needs: [linux, windows, macos-arm, sdist]
    runs-on: ubuntu-latest
    # The publish job fires on:
    #  - real `release: published` events for `py-v*` tags (the normal flow), or
    #  - manual `workflow_dispatch` runs that pass `publish=true` (verification
    #    of the OIDC trust relationship without cutting a real release —
    #    `skip-existing: true` makes it a no-op against any version already on
    #    PyPI).
    if: |
      (github.event_name == 'release' && startsWith(github.ref, 'refs/tags/py-v'))
      || (github.event_name == 'workflow_dispatch' && inputs.publish == 'true')
    environment:
      name: pypi
      url: https://pypi.org/project/capnagent
    permissions:
      # Required by `pypa/gh-action-pypi-publish` to mint a short-lived
      # OIDC token. PyPI verifies the token against the trusted-publisher
      # config (owner / repo / workflow / environment) and accepts the
      # upload without any long-lived API token.
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: dist

      - name: Publish to PyPI (Trusted Publishing / OIDC)
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          skip-existing: true
          verbose: true
          print-hash: true
