[package]
name = "capnagent-core"
description = "Capability-based authority tokens for AI agent tool calls (macaroon-style)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
hmac = "0.12"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
# Pin below 1.0.141 — newer versions pull in `zmij` (a legitimate dtolnay
# float-formatting crate, replacing ryu), but its unsigned build.rs is
# blocked by Windows AppLocker on dev machines. Revisit when toolchains
# allow signed build scripts or when AppLocker policy is updated.
# `arbitrary_precision`: preserves the source text of JSON numbers
# rather than collapsing them to f64 at parse time. This is load-
# bearing for the v0.6 A.1 closure — a holder that emits
# `amount: 50.000000000000001` (16 digits past decimal, collapses to
# bit-identical f64 50.0) can no longer slip past
# `arg.amount <= 50`, because the DSL evaluator now sees the original
# fractional source-form and rejects an integer-domain caveat against
# a float-syntactic arg. See `caveat_dsl.rs::json_to_value` for the
# precise check.
serde_json = { version = "=1.0.140", features = ["arbitrary_precision"] }
base64 = "0.22"
thiserror = "1"
subtle = "2"
# ed25519 for DPoP-style holder-of-key proofs. `default-features = false`
# drops `rand_core` from the dep tree because we never generate keys
# inside this crate — keys are produced by the holder and we only verify
# signatures here.
ed25519-dalek = { version = "2", default-features = false }

[dev-dependencies]
proptest = "1"
# Tests need to generate ed25519 key pairs to exercise holder-of-key.
# `rand_core` is the trait surface; `OsRng` lives in `rand`.
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
base64 = "0.22"
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "verify_pipeline"
harness = false

# Purple-team round 04 — revocation race / revoked-capability replay.
# The file uses the corpus naming convention `*.purple.rs` so it stands
# out from regular integration tests; cargo doesn't accept dots in
# auto-discovered crate names, so we declare it explicitly with a
# sanitized crate name and an explicit path.
[[test]]
name = "round_04_revocation_race_purple"
path = "tests/round_04_revocation_race.purple.rs"
